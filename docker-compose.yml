# Local stack: MariaDB + WordPress + WP-CLI.
# Pin image tags to match the server's PHP and database versions.
name: my-project

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DEBUG: "1"
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    define( 'WP_DEBUG_LOG', true );
    define( 'DISALLOW_FILE_EDIT', true );
    define( 'WP_DEVELOPMENT_MODE', 'theme' );

x-wp-volumes: &wp-volumes
  - wp:/var/www/html
  - ./themes/my-project:/var/www/html/wp-content/themes/my-project
  - ./plugins/my-project-core:/var/www/html/wp-content/plugins/my-project-core
  - ./docker/mu-plugins:/var/www/html/wp-content/mu-plugins
  - ./docker/php-uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
  - ./seed:/var/www/seed:ro
  - ./tests:/var/www/tests:ro

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  wordpress:
    image: wordpress:6.8-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment: *wp-env
    volumes: *wp-volumes

  cli:
    image: wordpress:cli-php8.3
    user: "33:33" # same uid as www-data in the apache image, so file permissions match
    profiles: ["cli"] # not started by "up"; used through scripts/wp
    depends_on:
      db:
        condition: service_healthy
    environment: *wp-env
    volumes: *wp-volumes

volumes:
  db:
  wp:
